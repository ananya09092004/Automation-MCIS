# Serves the CRA build as a single-page app: any path that isn't a real
# static file falls back to index.html so client-side routing works on
# a hard refresh/deep link, rather than nginx returning its own 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets CRA content-hashes already change on every real
    # rebuild, so they're safe to cache aggressively.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
